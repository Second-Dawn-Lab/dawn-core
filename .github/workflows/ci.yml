name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # windows-latest has Visual Studio and CMake preinstalled, which is all CTranslate2 and oneDNN need.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # CTranslate2 and oneDNN (the default backend) take about 13 minutes to compile. rust-cache
      # keeps their build output (target/) keyed on Cargo.lock and the toolchain, so only a cold
      # cache (first run, lockfile change, new toolchain) pays that.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-dnnl
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: cargo check --workspace
      - run: cargo test --workspace
