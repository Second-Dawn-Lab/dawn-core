[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# Optimize dependencies even in dev builds: hashing, unzipping and tokenizing 65 MB model
# archives is far too slow unoptimized. Our own crates stay fast to rebuild.
# (Apps that depend on dawn-core by path repeat these profile settings in their own workspace.)
[profile.dev.package."*"]
opt-level = 3

# Our own number-crunching crates stay fast in dev builds too (image scaling, BMP conversion).
[profile.dev.package.dawn-ocr]
opt-level = 3
[profile.dev.package.dawn-capture]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
