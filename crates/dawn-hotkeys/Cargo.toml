[package]
name = "dawn-hotkeys"
description = "Second Dawn global hotkeys: double-press shortcuts such as Ctrl+C+C, observed without swallowing keys"
version.workspace = true
edition.workspace = true
license.workspace = true

# Windows only for now. The keyboard hook and the foreground-app lookup call Win32 directly:
# no maintained crate observes keys without taking them over, and the hook callback has to stay
# tiny (see src/windows.rs), so the official `windows` bindings are the smallest honest choice.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
